<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - Freelance Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-r from-blue-500 to-purple-600">
    <div class="min-h-screen flex items-center justify-center py-12 px-4">
        <div class="max-w-md w-full bg-white rounded-xl shadow-2xl p-8">
            <div class="text-center">
                <div class="text-5xl mb-4">📧</div>
                <h2 class="text-2xl font-bold text-gray-900 mb-2">Verify OTP</h2>
                <p class="text-gray-600">Enter the 6-digit code sent to <strong class="text-blue-600">{{ email }}</strong></p>
            </div>
            
            {% if messages %}
                {% for message in messages %}
                    <div class="mt-4 p-3 rounded {% if message.tags == 'success' %}bg-green-100 text-green-700 border border-green-200{% else %}bg-red-100 text-red-700 border border-red-200{% endif %}">
                        <i class="fas {% if message.tags == 'success' %}fa-check-circle{% else %}fa-exclamation-circle{% endif %} mr-2"></i>
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
            
            <form method="POST" class="mt-8" id="otpForm">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2 text-center">OTP Code</label>
                    <div class="flex justify-center">
                        <input type="text" name="otp" id="otp" required maxlength="6" 
                               class="w-48 text-center text-3xl tracking-widest px-4 py-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               placeholder="000000" autocomplete="off">
                    </div>
                    <p class="text-xs text-gray-500 text-center mt-2">Enter the 6-digit code sent to your email</p>
                </div>
                
                <button type="submit" 
                        class="mt-6 w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition flex items-center justify-center">
                    <i class="fas fa-check-circle mr-2"></i>
                    Verify OTP
                </button>
            </form>
            
            <div class="mt-6 text-center">
                <p class="text-sm text-gray-600">
                    Didn't receive code? 
                    <a href="{% url 'resend-reset-otp' %}" class="text-blue-600 hover:underline">
                        <i class="fas fa-redo-alt mr-1"></i> Resend OTP
                    </a>
                </p>
                <p class="text-sm mt-2">
                    <a href="{% url 'forgot-password' %}" class="text-gray-500 hover:underline">
                        <i class="fas fa-arrow-left mr-1"></i> Try different email
                    </a>
                </p>
            </div>
        </div>
    </div>
    
    <script>
        const otpInput = document.getElementById('otp');
        
        // Only allow numbers
        otpInput.addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '').slice(0, 6);
        });
        
        // Auto submit when 6 digits entered
        otpInput.addEventListener('input', function() {
            if (this.value.length === 6) {
                document.getElementById('otpForm').submit();
            }
        });
        
        // Focus on input
        otpInput.focus();
    </script>
</body>
</html>
