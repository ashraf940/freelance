<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - Freelance Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-r from-blue-500 to-purple-600">
    <div class="min-h-screen flex items-center justify-center py-12 px-4">
        <div class="max-w-md w-full bg-white rounded-xl shadow-2xl p-8">
            <div class="text-center">
                <div class="text-5xl mb-4">🔑</div>
                <h2 class="text-2xl font-bold text-gray-900 mb-2">Set New Password</h2>
                <p class="text-gray-600">Create a strong password for your account</p>
            </div>
            
            {% if messages %}
                {% for message in messages %}
                    <div class="mt-4 p-3 rounded {% if message.tags == 'success' %}bg-green-100 text-green-700 border border-green-200{% else %}bg-red-100 text-red-700 border border-red-200{% endif %}">
                        <i class="fas {% if message.tags == 'success' %}fa-check-circle{% else %}fa-exclamation-circle{% endif %} mr-2"></i>
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
            
            <form method="POST" class="mt-8 space-y-4" id="passwordForm">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">New Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-lock text-gray-400"></i>
                        </div>
                        <input type="password" name="new_password" id="new_password" required 
                               class="pl-10 w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               placeholder="Enter new password">
                    </div>
                    <p class="text-xs text-gray-500 mt-1">Minimum 8 characters with letters and numbers</p>
                    <div id="passwordStrength" class="mt-2"></div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Confirm Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-check-circle text-gray-400"></i>
                        </div>
                        <input type="password" name="confirm_password" id="confirm_password" required 
                               class="pl-10 w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               placeholder="Confirm your password">
                    </div>
                    <p id="matchMessage" class="text-xs mt-1"></p>
                </div>
                
                <button type="submit" 
                        class="mt-4 w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition flex items-center justify-center">
                    <i class="fas fa-save mr-2"></i>
                    Reset Password
                </button>
            </form>
            
            <div class="mt-6 text-center">
                <a href="{% url 'login' %}" class="text-sm text-blue-600 hover:underline">
                    <i class="fas fa-arrow-left mr-1"></i> Back to Login
                </a>
            </div>
        </div>
    </div>
    
    <script>
        const password = document.getElementById('new_password');
        const confirm = document.getElementById('confirm_password');
        const strengthDiv = document.getElementById('passwordStrength');
        const matchMessage = document.getElementById('matchMessage');
        
        function checkPasswordStrength() {
            const val = password.value;
            let strength = 0;
            
            if (val.length >= 8) strength++;
            if (/[a-z]/.test(val)) strength++;
            if (/[A-Z]/.test(val)) strength++;
            if (/[0-9]/.test(val)) strength++;
            
            let text = '', color = '';
            if (strength <= 2) { text = 'Weak'; color = 'text-red-500'; }
            else if (strength <= 3) { text = 'Medium'; color = 'text-yellow-500'; }
            else { text = 'Strong'; color = 'text-green-500'; }
            
            strengthDiv.innerHTML = `<span class="${color} text-xs"><i class="fas fa-shield-alt mr-1"></i>Password Strength: ${text}</span>`;
        }
        
        function checkMatch() {
            if (confirm.value && password.value !== confirm.value) {
                matchMessage.innerHTML = '<i class="fas fa-times-circle mr-1 text-red-500"></i><span class="text-red-500"> Passwords do not match</span>';
                return false;
            } else if (confirm.value && password.value === confirm.value) {
                matchMessage.innerHTML = '<i class="fas fa-check-circle mr-1 text-green-500"></i><span class="text-green-500"> Passwords match</span>';
                return true;
            }
            matchMessage.innerHTML = '';
            return false;
        }
        
        password.addEventListener('input', function() {
            checkPasswordStrength();
            checkMatch();
        });
        
        confirm.addEventListener('input', checkMatch);
        
        document.getElementById('passwordForm').addEventListener('submit', function(e) {
            if (!checkMatch()) {
                e.preventDefault();
                alert('Please make sure passwords match');
            }
            if (password.value.length < 8) {
                e.preventDefault();
                alert('Password must be at least 8 characters');
            }
        });
    </script>
</body>
</html>
