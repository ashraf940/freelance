{% extends 'base.html' %}
{% load static %}

{% block title %}Platform Settings - Admin Panel{% endblock %}

{% block content %}
<style>
    .admin-container { max-width: 800px; margin: 0 auto; padding: 30px 20px; }
    .settings-card { background: white; border-radius: 20px; border: 1px solid #e5e7eb; padding: 30px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 8px; color: #374151; }
    .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 8px; }
    .btn-save { background: #3b82f6; color: white; border: none; padding: 12px 30px; border-radius: 8px; cursor: pointer; font-weight: 600; }
</style>

<div class="admin-container">
    <div class="admin-header"><h1>Platform Settings</h1><p>Configure your platform preferences</p></div>

    <div class="settings-card">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-group">
                <label>Site Name</label>
                <input type="text" name="site_name" value="{{ settings.site_name }}">
            </div>

            <div class="form-group">
                <label>Commission Rate (%)</label>
                <input type="number" step="0.5" name="commission_rate" value="{{ settings.commission_rate }}">
            </div>

            <div class="form-group">
                <label>Minimum Withdrawal ($)</label>
                <input type="number" step="100" name="min_withdrawal" value="{{ settings.min_withdrawal }}">
            </div>

            <div class="form-group">
                <label>Contact Email</label>
                <input type="email" name="contact_email" value="{{ settings.contact_email }}">
            </div>

            <div class="form-group">
                <label>Support Phone</label>
                <input type="text" name="support_phone" value="{{ settings.support_phone }}">
            </div>

            <div class="form-group">
                <label>Site Logo</label>
                <input type="file" name="site_logo" accept="image/*">
                {% if settings.site_logo %}<p style="margin-top:5px; font-size:12px;">Current: {{ settings.site_logo.name }}</p>{% endif %}
            </div>

            <div style="margin-top: 30px;">
                <button type="submit" class="btn-save">Save Settings</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
