{% extends 'base.html' %}

{% block content %}
<div style="padding: 20px;">
    <h1>Blog Categories</h1>
    
    <table style="width: 100%; margin-top: 20px; border-collapse: collapse;">
        <thead>
            <tr>
                <th style="border: 1px solid #ddd; padding: 10px;">Name</th>
                <th style="border: 1px solid #ddd; padding: 10px;">Slug</th>
                <th style="border: 1px solid #ddd; padding: 10px;">Created</th>
            </tr>
        </thead>
        <tbody>
            {% for cat in categories %}
            <tr>
                <td style="border: 1px solid #ddd; padding: 10px;">{{ cat.name }}</td>
                <td style="border: 1px solid #ddd; padding: 10px;">{{ cat.slug }}</td>
                <td style="border: 1px solid #ddd; padding: 10px;">{{ cat.created_at|date:"Y-m-d" }}</td>
            </tr>
            {% empty %}
            <tr><td colspan="3" style="text-align: center;">No categories</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
