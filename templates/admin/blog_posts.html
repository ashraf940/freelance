{% extends 'base.html' %}

{% block content %}
<div style="padding: 20px;">
    <h1>Blog Posts</h1>
    <a href="/admin-panel/blog-add/" style="background: blue; color: white; padding: 8px 15px; text-decoration: none; border-radius: 5px;">+ Add New</a>
    
    <table style="width: 100%; margin-top: 20px; border-collapse: collapse;">
        <thead>
            <tr>
                <th style="border: 1px solid #ddd; padding: 10px;">Title</th>
                <th style="border: 1px solid #ddd; padding: 10px;">Category</th>
                <th style="border: 1px solid #ddd; padding: 10px;">Status</th>
                <th style="border: 1px solid #ddd; padding: 10px;">Date</th>
                <th style="border: 1px solid #ddd; padding: 10px;">Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for post in posts %}
            <tr>
                <td style="border: 1px solid #ddd; padding: 10px;">{{ post.title }}</td>
                <td style="border: 1px solid #ddd; padding: 10px;">{{ post.category.name }}</td>
                <td style="border: 1px solid #ddd; padding: 10px;">{{ post.status }}</td>
                <td style="border: 1px solid #ddd; padding: 10px;">{{ post.published_at|date:"Y-m-d" }}</td>
                <td style="border: 1px solid #ddd; padding: 10px;">
                    <a href="/admin-panel/blog-edit/{{ post.id }}/">Edit</a> |
                    <a href="/admin-panel/blog-delete/{{ post.id }}/" onclick="return confirm('Delete?')" style="color: red;">Delete</a>
                </td>
            </tr>
            {% empty %}
            <tr><td colspan="5" style="text-align: center;">No blogs yet</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
