<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freelance Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 90%;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        
        .status {
            background: #4CAF50;
            color: white;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 30px;
        }
        
        .api-section {
            text-align: left;
            margin-top: 30px;
        }
        
        h2 {
            color: #555;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .endpoint {
            background: #f4f4f4;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            font-family: monospace;
        }
        
        .endpoint a {
            color: #667eea;
            text-decoration: none;
        }
        
        .endpoint a:hover {
            text-decoration: underline;
        }
        
        .method {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 12px;
            margin-right: 10px;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            font-size: 16px;
        }
        
        button:hover {
            background: #5a67d8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Freelance Platform</h1>
        <div class="status">
            ✅ Server is running successfully!
        </div>
        
        <div class="api-section">
            <h2>Available Endpoints</h2>
            
            <div class="endpoint">
                <span class="method">ADMIN</span>
                <a href="/admin/">/admin/</a> - Django Admin Panel
            </div>
            
            <div class="endpoint">
                <span class="method">API</span>
                <a href="/swagger/">/swagger/</a> - Swagger API Documentation
            </div>
            
            <div class="endpoint">
                <span class="method">API</span>
                <a href="/redoc/">/redoc/</a> - ReDoc API Documentation
            </div>
            
            <div class="endpoint">
                <span class="method">API</span>
                <a href="/api/accounts/">/api/accounts/</a> - Accounts API
            </div>
            
            <div class="endpoint">
                <span class="method">API</span>
                <a href="/api/gigs/">/api/gigs/</a> - Gigs API
            </div>
            
            <div class="endpoint">
                <span class="method">API</span>
                <a href="/api/jobs/">/api/jobs/</a> - Jobs API
            </div>
        </div>
        
        <button onclick="window.location.href='/admin/'">
            Go to Admin Panel
        </button>
    </div>
</body>
</html>
